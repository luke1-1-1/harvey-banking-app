<script>
        const GEMINI_API_KEY = "AQ.Ab8RN6Jdbg1uwM-KxtCekJB6OEKGmpbAtcGJOyAga0YXvf-VNw";

        const state = {
            balance: 14567.22,
            hideBalance: false,
            pensionReceived: true,
            transactions: [
                {
                    id: 1,
                    title: 'SSS Pension Direct Deposit',
                    sender: 'Social Security / Pension Fund',
                    type: 'income',
                    category: 'Pension',
                    amount: 4000.00,
                    date: 'Today, 8:00 AM',
                    status: 'Completed',
                    icon: 'fa-piggy-bank',
                    iconBg: 'bg-emerald-500/20 text-emerald-400'
                },
                {
                    id: 2,
                    title: 'Fresh Market Supermarket',
                    sender: 'Grocery & Provisions',
                    type: 'expense',
                    category: 'Groceries',
                    amount: 124.50,
                    date: 'Yesterday, 4:15 PM',
                    status: 'Completed',
                    icon: 'fa-cart-shopping',
                    iconBg: 'bg-blue-500/20 text-blue-400'
                },
                {
                    id: 3,
                    title: 'City Power & Electric Co.',
                    sender: 'Utility Provider',
                    type: 'expense',
                    category: 'Utilities',
                    amount: 85.00,
                    date: 'May 3, 2026, 11:30 AM',
                    status: 'Completed',
                    icon: 'fa-bolt',
                    iconBg: 'bg-amber-500/20 text-amber-400'
                },
                {
                    id: 4,
                    title: 'TechZone Electronics',
                    sender: 'Online Merchant Store',
                    type: 'expense',
                    category: 'Shopping',
                    amount: 210.00,
                    date: 'May 1, 2026, 9:20 PM',
                    status: 'Completed',
                    icon: 'fa-bag-shopping',
                    iconBg: 'bg-purple-500/20 text-purple-400'
                }
            ],
            isListening: false
        };

        document.addEventListener('DOMContentLoaded', () => {
            renderTransactions(state.transactions);
            updateBalanceUI();
            setupVoiceRecognition();
        });

        function updateBalanceUI() {
            const balanceElement = document.getElementById('main-balance-text');
            const eyeIcon = document.getElementById('balance-eye-icon');

            if (state.hideBalance) {
                balanceElement.innerText = '••••••••';
                eyeIcon.className = 'fa-regular fa-eye-slash text-lg';
            } else {
                balanceElement.innerText = '$' + state.balance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                eyeIcon.className = 'fa-regular fa-eye text-lg';
            }
        }

        function toggleBalanceVisibility() {
            state.hideBalance = !state.hideBalance;
            updateBalanceUI();
            showToast(state.hideBalance ? 'Balance hidden' : 'Balance revealed', 'info');
        }

        function renderTransactions(list) {
            const container = document.getElementById('transaction-list');
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs">No transactions match your search criteria.</div>`;
                return;
            }

            list.forEach(tx => {
                const isIncome = tx.type === 'income';
                const amountFormatted = (isIncome ? '+' : '-') + '$' + tx.amount.toLocaleString('en-US', { minimumFractionDigits: 2 });
                const card = document.createElement('div');
                card.className = 'glass-card-sm p-4 rounded-2xl flex items-center justify-between hover:bg-slate-800/50 transition';
                card.innerHTML = `
                    <div class="flex items-center gap-3.5">
                        <div class="w-10 h-10 rounded-xl ${tx.iconBg} flex items-center justify-center text-sm font-bold flex-shrink-0">
                            <i class="fa-solid ${tx.icon}"></i>
                        </div>
                        <div>
                            <h4 class="text-xs font-bold text-white">${tx.title}</h4>
                            <div class="flex items-center gap-2 mt-0.5">
                                <span class="text-[11px] text-slate-400">${tx.sender}</span>
                                <span class="text-[10px] text-slate-500">• ${tx.date}</span>
                            </div>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="text-xs font-extrabold ${isIncome ? 'text-emerald-400' : 'text-slate-200'}">
                            ${amountFormatted}
                        </span>
                        <div class="mt-0.5">
                            <span class="text-[10px] px-2 py-0.5 rounded-full ${isIncome ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-slate-800 text-slate-400'} font-medium">
                                ${tx.category}
                            </span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterTransactions() {
            const search = document.getElementById('tx-search-input').value.toLowerCase();
            const category = document.getElementById('tx-category-select').value;

            const filtered = state.transactions.filter(tx => {
                const matchesSearch = tx.title.toLowerCase().includes(search) || tx.sender.toLowerCase().includes(search);
                const matchesCategory = category === 'all' || 
                                        (category === 'income' && tx.type === 'income') ||
                                        (category === 'expense' && tx.type === 'expense') ||
                                        (tx.category.toLowerCase() === category.toLowerCase());
                return matchesSearch && matchesCategory;
            });

            renderTransactions(filtered);
        }

        function openSendModal() { document.getElementById('send-modal').classList.remove('hidden'); }
        function closeSendModal() {
            document.getElementById('send-modal').classList.add('hidden');
            document.getElementById('send-money-form').reset();
            document.getElementById('harvey-scam-warning').classList.add('hidden');
        }

        function quickSelectContact(name, phone) {
            openSendModal();
            document.getElementById('send-recipient').value = `${name} (${phone})`;
            checkRecipientRisk(phone);
        }

        function checkRecipientRisk(val) {
            const warningBox = document.getElementById('harvey-scam-warning');
            const warningText = document.getElementById('harvey-warning-text');
            if (val.includes('999') || val.toLowerCase().includes('unknown') || val.length > 15) {
                warningText.innerText = "Security Alert: This recipient number is unverified. If an unknown caller asked you to transfer funds, please stop and verify.";
                warningBox.classList.remove('hidden');
            } else {
                warningBox.classList.add('hidden');
            }
        }

        function checkAmountRisk(amt) {
            const warningBox = document.getElementById('harvey-scam-warning');
            const warningText = document.getElementById('harvey-warning-text');
            const val = parseFloat(amt);
            if (val > 1000) {
                warningText.innerText = `High Value Transfer Alert: You are transferring $${val.toLocaleString()}. HARVEY recommends confirming target bank details twice.`;
                warningBox.classList.remove('hidden');
            } else if (!document.getElementById('send-recipient').value.includes('999')) {
                warningBox.classList.add('hidden');
            }
        }

        function handleSendMoney(e) {
            e.preventDefault();
            const recipient = document.getElementById('send-recipient').value;
            const amount = parseFloat(document.getElementById('send-amount').value);
            const category = document.getElementById('send-category').value;
            const note = document.getElementById('send-note').value || 'Direct Transfer';

            if (amount > state.balance) {
                showToast('Insufficient balance for this transfer', 'error');
                return;
            }

            state.balance -= amount;
            updateBalanceUI();

            const newTx = {
                id: Date.now(),
                title: `Transfer to ${recipient}`,
                sender: note,
                type: 'expense',
                category: category,
                amount: amount,
                date: 'Just now',
                status: 'Completed',
                icon: 'fa-paper-plane',
                iconBg: 'bg-indigo-500/20 text-indigo-400'
            };

            state.transactions.unshift(newTx);
            renderTransactions(state.transactions);
            closeSendModal();

            showToast(`Successfully transferred $${amount.toFixed(2)} to ${recipient}`, 'success');
            speakHarveyResponse(`Successfully sent $${amount.toFixed(2)} to ${recipient}.`);
        }

        function openDepositModal() { document.getElementById('deposit-modal').classList.remove('hidden'); }
        function closeDepositModal() { document.getElementById('deposit-modal').classList.add('hidden'); }
        function handleDepositMoney(e) {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('deposit-amount').value);
            state.balance += amount;
            updateBalanceUI();

            const newTx = {
                id: Date.now(),
                title: 'Bank Deposit Add-Funds',
                sender: 'Linked Savings Account',
                type: 'income',
                category: 'Deposit',
                amount: amount,
                date: 'Just now',
                status: 'Completed',
                icon: 'fa-plus-circle',
                iconBg: 'bg-emerald-500/20 text-emerald-400'
            };

            state.transactions.unshift(newTx);
            renderTransactions(state.transactions);
            closeDepositModal();

            showToast(`Deposited $${amount.toFixed(2)} into your wallet`, 'success');
        }

        function openRequestModal() { document.getElementById('request-modal').classList.remove('hidden'); }
        function closeRequestModal() { document.getElementById('request-modal').classList.add('hidden'); }
        function handleRequestMoney(e) {
            e.preventDefault();
            const contact = document.getElementById('request-contact').value;
            const amount = parseFloat(document.getElementById('request-amount').value);
            closeRequestModal();
            showToast(`Payment request for $${amount.toFixed(2)} sent to ${contact}`, 'info');
        }

        function showStatements() {
            showToast('Generating PDF statement for current billing cycle...', 'info');
        }

        let recognition = null;
        function toggleHarveyModal() {
            const win = document.getElementById('harvey-ai-window');
            win.classList.toggle('hidden');
        }

        function setupVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.lang = 'en-US';

                recognition.onstart = () => {
                    state.isListening = true;
                    document.getElementById('harvey-mic-btn').classList.add('pulse-ring', 'bg-pink-600');
                };

                recognition.onend = () => {
                    state.isListening = false;
                    document.getElementById('harvey-mic-btn').classList.remove('pulse-ring', 'bg-pink-600');
                };

                recognition.onresult = (event) => {
                    const text = event.results[0][0].transcript;
                    processUserMessage(text);
                };
            }
        }

        function toggleVoiceListening() {
            if (!recognition) {
                addHarveyChatMessage("System", "Speech recognition is disabled in this browser iframe. Type your request below!");
                return;
            }
            if (state.isListening) { recognition.stop(); } else { recognition.start(); }
        }

        function triggerVoiceQuery(queryText) { processUserMessage(queryText); }

        function sendHarveyMessage() {
            const input = document.getElementById('harvey-text-input');
            const val = input.value.trim();
            if (!val) return;
            input.value = '';
            processUserMessage(val);
        }

        async function processUserMessage(userText) {
            addHarveyChatMessage('user', userText);

            // Attempt Gemini API Call
            if (GEMINI_API_KEY && GEMINI_API_KEY.length > 10) {
                const thinkingId = addHarveyThinkingIndicator();
                try {
                    const aiReply = await fetchGeminiResponse(userText);
                    removeHarveyThinkingIndicator(thinkingId);
                    addHarveyChatMessage('harvey', aiReply);
                    speakHarveyResponse(aiReply);
                    return;
                } catch (err) {
                    console.warn("Gemini API call failed, using built-in Smart Engine:", err);
                    removeHarveyThinkingIndicator(thinkingId);
                }
            }

            // Smart Assistant Fallback Engine (Answers any context-aware query)
            const text = userText.toLowerCase();
            let aiReply = '';

            if (text.includes("pension") || text.includes("money come in") || text.includes("deposit")) {
                aiReply = state.pensionReceived 
                    ? "Yes! Your SSS Pension of $4,000.00 was deposited into your account this morning at 8:00 AM." 
                    : "No pension deposit has arrived yet today.";
            } else if (text.includes("vacation") || text.includes("trip") || text.includes("travel") || text.includes("spend")) {
                const recommendedBudget = (state.balance * 0.15).toFixed(2);
                aiReply = `Based on your balance of $${state.balance.toLocaleString()}, a safe budget for vacation spending is around 15% ($${recommendedBudget}). This keeps your core savings safe!`;
            } else if (text.includes("save") || text.includes("budget") || text.includes("advice")) {
                aiReply = `With $14,567.22 available, try putting 20% into higher-yield savings. You have a solid emergency reserve ready.`;
            } else if (text.includes("hello") || text.includes("hi") || text.includes("hey")) {
                aiReply = "Hello Alex! I am HARVEY, your security and financial AI assistant. Ask me about your balance, vacation budget, or pension!";
            } else if (text.includes("balance") || text.includes("how much money") || text.includes("account")) {
                aiReply = `Your total available balance is $${state.balance.toLocaleString('en-US', {minimumFractionDigits:2})}.`;
            } else if (text.includes("transaction") || text.includes("recent") || text.includes("history")) {
                aiReply = `Your last transaction was ${state.transactions[0].title} for $${state.transactions[0].amount.toFixed(2)}.`;
            } else if (text.includes("send") || text.includes("transfer") || text.includes("pay")) {
                openSendModal();
                aiReply = "I have opened the Send Money form. Please input recipient and transfer details.";
            } else {
                aiReply = `Looking at your balance of $${state.balance.toLocaleString('en-US', {minimumFractionDigits:2})}, you are in great financial standing to handle this request!`;
            }

            setTimeout(() => {
                addHarveyChatMessage('harvey', aiReply);
                speakHarveyResponse(aiReply);
            }, 300);
        }

        async function fetchGeminiResponse(userQuestion) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`;
            const prompt = `
You are HARVEY, an intelligent financial AI voice assistant inside an e-wallet banking app.
Answer concisely in 1 to 3 short sentences max.

Current User Account Context:
- Account Holder: Alex Morgan
- Total Balance: $${state.balance.toFixed(2)}
- Pension Received Today: ${state.pensionReceived ? '$4,000.00 SSS Pension at 8:00 AM' : 'No'}
- Recent Transactions: ${JSON.stringify(state.transactions.slice(0, 3).map(t => ({ title: t.title, amount: t.amount, type: t.type, date: t.date })))}

User Question: "${userQuestion}"
            `;

            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            if (!response.ok) throw new Error(`Gemini HTTP Error: ${response.status}`);
            const data = await response.json();
            if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts[0]) {
                return data.candidates[0].content.parts[0].text.trim();
            }
            throw new Error("Invalid Gemini response format");
        }

        function addHarveyThinkingIndicator() {
            const chatContainer = document.getElementById('harvey-chat-messages');
            const id = 'thinking-' + Date.now();
            const msgDiv = document.createElement('div');
            msgDiv.id = id;
            msgDiv.className = 'flex items-start gap-2.5';
            msgDiv.innerHTML = `
                <div class="w-7 h-7 rounded-full bg-purple-600 flex-shrink-0 flex items-center justify-center text-white font-bold text-xs">H</div>
                <div class="bg-slate-800/90 border border-slate-700/60 p-3 rounded-2xl rounded-tl-none text-slate-400 max-w-[85%] leading-relaxed flex items-center gap-2">
                    <i class="fa-solid fa-circle-notch animate-spin text-purple-400"></i>
                    <span>HARVEY is thinking...</span>
                </div>
            `;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function removeHarveyThinkingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function addHarveyChatMessage(sender, text) {
            const chatContainer = document.getElementById('harvey-chat-messages');
            const msgDiv = document.createElement('div');
            if (sender === 'user') {
                msgDiv.className = 'flex items-start justify-end gap-2.5';
                msgDiv.innerHTML = `<div class="bg-purple-600 text-white p-3 rounded-2xl rounded-tr-none max-w-[85%] leading-relaxed">${text}</div>`;
            } else {
                msgDiv.className = 'flex items-start gap-2.5';
                msgDiv.innerHTML = `
                    <div class="w-7 h-7 rounded-full bg-purple-600 flex-shrink-0 flex items-center justify-center text-white font-bold text-xs">H</div>
                    <div class="bg-slate-800/90 border border-slate-700/60 p-3 rounded-2xl rounded-tl-none text-slate-200 max-w-[85%] leading-relaxed">${text}</div>
                `;
            }
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function speakHarveyResponse(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                const voices = window.speechSynthesis.getVoices();
                utterance.voice = voices.find(v => v.lang.includes('en') && (v.name.includes('Female') || v.name.includes('Google'))) || voices[0];
                window.speechSynthesis.speak(utterance);
            }
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let borderBg = 'border-brand-500 bg-slate-900';
            let icon = 'fa-circle-info text-brand-400';
            if (type === 'success') { borderBg = 'border-emerald-500 bg-slate-900'; icon = 'fa-circle-check text-emerald-400'; }
            else if (type === 'error') { borderBg = 'border-rose-500 bg-slate-900'; icon = 'fa-circle-exclamation text-rose-400'; }

            toast.className = `flex items-center gap-3 px-4 py-3 rounded-2xl border ${borderBg} text-xs font-semibold text-white shadow-2xl transition transform translate-x-full pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-sm"></i> <span>${msg}</span>`;
            container.appendChild(toast);

            setTimeout(() => { toast.classList.remove('translate-x-full'); }, 50);
            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }
    </script>
